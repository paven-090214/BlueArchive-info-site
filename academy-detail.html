<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>학원 상세 | BlueArchive Info Site</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="./index.html" aria-label="메인 페이지로 이동">
        <span class="logo-mark">BA</span>
        <span class="logo-text">BlueArchive Info Site</span>
      </a>

      <div class="student-search" role="search">
        <label class="search-label" for="student-search-input">학생 검색</label>
        <input
          id="student-search-input"
          class="student-search-input"
          type="search"
          placeholder="학생 이름 검색"
          autocomplete="off"
          aria-controls="student-suggestions"
          aria-expanded="false"
        />
        <div id="student-suggestions" class="student-suggestions" hidden></div>
      </div>
    </header>

    <main class="page-shell academy-detail-shell">
      <section class="academy-detail-grid" aria-label="학원 상세 정보">
        <div class="academy-detail-left">
          <article class="panel academy-intro-panel">
            <div id="academy-hero-mark" class="academy-hero-placeholder gehenna-mark" aria-hidden="true">
              G
            </div>
            <div>
              <p class="eyebrow">ACADEMY</p>
              <h1 id="academy-name">게헨나 학원</h1>
              <p id="academy-description">
                자유로운 분위기와 강한 개성을 가진 학생들이 모인 학원입니다. 실제 학원 소개
                데이터는 추후 academies 테이블과 연결합니다.
              </p>
            </div>
          </article>

          <section class="panel club-panel" aria-label="동아리 목록">
            <div class="panel-heading">
              <p class="eyebrow">CLUB</p>
              <h2>동아리 목록</h2>
            </div>

            <div class="club-list" id="club-list"></div>
          </section>
        </div>

        <aside class="academy-detail-right" aria-label="학원 지도와 스케줄">
          <section class="panel map-panel">
            <div class="panel-heading">
              <p class="eyebrow">MAP</p>
              <h2>학원 지도</h2>
            </div>
            <div class="academy-map-placeholder">
              <span>지도 placeholder</span>
            </div>
            <p>학원 건물과 주요 위치는 추후 실제 데이터와 이미지로 연결합니다.</p>
          </section>

          <section class="panel schedule-panel">
            <div class="panel-heading">
              <p class="eyebrow">SCHEDULE</p>
              <h2>학원 스케줄</h2>
            </div>
            <ul class="schedule-list">
              <li>
                <span>임시 일정</span>
                <strong>샬레 업무 협조</strong>
              </li>
              <li>
                <span>임시 일정</span>
                <strong>학원 순찰</strong>
              </li>
            </ul>
          </section>
        </aside>
      </section>
    </main>

    <script type="module">
      import { academies, clubs, students } from "./data/index.js";

      const searchInput = document.querySelector("#student-search-input");
      const suggestionPanel = document.querySelector("#student-suggestions");
      const academyName = document.querySelector("#academy-name");
      const academyDescription = document.querySelector("#academy-description");
      const academyHeroMark = document.querySelector("#academy-hero-mark");
      const clubList = document.querySelector("#club-list");

      const academyKey = new URLSearchParams(window.location.search).get("academy") || "gehenna";
      const selectedAcademy =
        academies.find((academy) => academy.slug === academyKey) ||
        academies.find((academy) => academy.slug === "gehenna");

      academyName.textContent = selectedAcademy.name;
      academyDescription.textContent = selectedAcademy.description;
      academyHeroMark.textContent = selectedAcademy.mark;
      academyHeroMark.className = `academy-hero-placeholder ${selectedAcademy.logoClass}`;

      function createClubCard(club, index) {
        const details = document.createElement("details");
        details.className = "club-card";
        details.open = index === 0;

        const summary = document.createElement("summary");
        const summaryText = document.createElement("span");
        const name = document.createElement("strong");
        const description = document.createElement("small");
        name.textContent = club.name;
        description.textContent = club.description;
        summaryText.append(name, description);
        summary.append(summaryText);

        const characterList = document.createElement("div");
        characterList.className = "club-character-list";

        const clubStudents = students.filter((student) => student.clubId === club.id);

        if (clubStudents.length === 0) {
          const emptyMessage = document.createElement("p");
          emptyMessage.className = "search-empty";
          emptyMessage.textContent = "표시할 학생 임시 데이터가 없습니다.";
          characterList.append(emptyMessage);
        } else {
          characterList.append(...clubStudents.map(createClubStudentLink));
        }

        details.append(summary, characterList);
        return details;
      }

      function createClubStudentLink(student) {
        const link = document.createElement("a");
        link.href = `character-detail.html?id=${student.id}`;
        link.className = "club-character-item";

        const image = document.createElement("span");
        image.className = "student-image-placeholder";
        image.setAttribute("aria-hidden", "true");
        image.textContent = student.name.slice(0, 1);

        const name = document.createElement("span");
        name.textContent = student.name;

        link.append(image, name);
        return link;
      }

      const academyClubs = clubs.filter((club) => club.academySlug === selectedAcademy.slug);

      if (academyClubs.length === 0) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "search-empty";
        emptyMessage.textContent = "표시할 동아리 임시 데이터가 없습니다.";
        clubList.replaceChildren(emptyMessage);
      } else {
        clubList.replaceChildren(...academyClubs.map(createClubCard));
      }

      function createSuggestionItem(student) {
        const link = document.createElement("a");
        link.className = "student-suggestion-item";
        link.href = `character-detail.html?id=${student.id}`;

        const image = document.createElement("span");
        image.className = "student-image-placeholder";
        image.setAttribute("aria-hidden", "true");
        image.textContent = student.name.slice(0, 1);

        const name = document.createElement("span");
        name.textContent = student.name;

        link.append(image, name);
        return link;
      }

      searchInput.addEventListener("input", () => {
        const keyword = searchInput.value.trim();
        suggestionPanel.replaceChildren();

        if (!keyword) {
          suggestionPanel.hidden = true;
          searchInput.setAttribute("aria-expanded", "false");
          return;
        }

        const matches = students.filter((student) => student.name.includes(keyword));

        if (matches.length === 0) {
          const emptyMessage = document.createElement("p");
          emptyMessage.className = "search-empty";
          emptyMessage.textContent = "검색 결과가 없습니다.";
          suggestionPanel.append(emptyMessage);
        } else {
          suggestionPanel.append(...matches.map(createSuggestionItem));
        }

        suggestionPanel.hidden = false;
        searchInput.setAttribute("aria-expanded", "true");
      });
    </script>
  </body>
</html>
