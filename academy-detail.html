<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>학원 상세 | BlueArchive Info Site</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="./index.html" aria-label="메인 페이지로 이동">
        <span class="logo-mark">BA</span>
        <span class="logo-text">BlueArchive Info Site</span>
      </a>

      <form class="site-search" id="site-search-form" role="search" aria-label="통합검색">
        <label class="search-label" for="site-search-input">통합검색</label>
        <input
          id="site-search-input"
          class="site-search-input"
          type="search"
          placeholder="통합검색"
          autocomplete="off"
        />
        <button class="site-search-button" type="submit" aria-label="검색 실행">🔍</button>
      </form>

      <div class="header-actions">
        <nav class="header-auth" aria-label="계정 메뉴">
          <a href="#" class="header-auth-link">로그인</a>
          <span aria-hidden="true">|</span>
          <a href="#" class="header-auth-link">회원가입</a>
        </nav>
      </div>
    </header>

    <main class="page-shell academy-detail-shell">
      <section class="academy-detail-grid" aria-label="학원 상세 정보">
        <div class="academy-detail-left">
          <article class="panel academy-intro-panel">
            <div id="academy-hero-mark" class="academy-hero-placeholder gehenna-mark" aria-hidden="true">
              G
            </div>
            <div>
              <p class="eyebrow">ACADEMY</p>
              <h1 id="academy-name">게헨나 학원</h1>
              <p id="academy-description">
                자유로운 분위기와 강한 개성을 가진 학생들이 모인 학원입니다. 실제 학원 소개
                데이터는 추후 academies 테이블과 연결합니다.
              </p>
            </div>
          </article>

          <section class="panel club-panel" aria-label="동아리 목록">
            <div class="panel-heading">
              <p class="eyebrow">CLUB</p>
              <h2>동아리 목록</h2>
            </div>

            <div class="club-list" id="club-list"></div>
          </section>
        </div>

        <aside class="academy-detail-right" aria-label="학원 지도와 스케줄">
          <section class="panel map-panel">
            <div class="panel-heading">
              <p class="eyebrow">MAP</p>
              <h2>학원 지도</h2>
            </div>
            <div id="academy-map" class="academy-map-frame">
              <div class="academy-map-placeholder">
                <span>지도 이미지 준비 중</span>
              </div>
            </div>
            <p>학원 건물과 주요 위치는 추후 실제 데이터와 이미지로 연결합니다.</p>
          </section>

          <section class="panel schedule-panel">
            <div class="panel-heading">
              <p class="eyebrow">SCHEDULE</p>
              <h2>학원 스케줄</h2>
            </div>
            <ul class="schedule-list">
              <li>
                <span>임시 일정</span>
                <strong>샬레 업무 협조</strong>
              </li>
              <li>
                <span>임시 일정</span>
                <strong>학원 순찰</strong>
              </li>
            </ul>
          </section>
        </aside>
      </section>
    </main>

    <script type="module" src="./pages/academyDetailPage.js"></script>
  </body>
</html>
