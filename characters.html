<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>학생 목록 | BlueArchive Info Site</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="./index.html" aria-label="메인 페이지로 이동">
        <span class="logo-mark">BA</span>
        <span class="logo-text">BlueArchive Info Site</span>
      </a>

      <form class="site-search" id="site-search-form" role="search" aria-label="통합검색">
        <label class="search-label" for="site-search-input">통합검색</label>
        <input
          id="site-search-input"
          class="site-search-input"
          type="search"
          placeholder="통합검색"
          autocomplete="off"
        />
        <button class="site-search-button" type="submit" aria-label="검색 실행">🔍</button>
      </form>

      <div class="header-actions">
        <div class="site-language-toggle" aria-label="표시 언어">
          <button class="site-language-button is-active" type="button" data-language-button="ko">한국어</button>
          <button class="site-language-button" type="button" data-language-button="en">English</button>
          <button class="site-language-button" type="button" data-language-button="jp">日本語</button>
        </div>

        <nav class="header-auth" aria-label="계정 메뉴">
          <a href="#" class="header-auth-link">로그인</a>
          <span aria-hidden="true">|</span>
          <a href="#" class="header-auth-link">회원가입</a>
        </nav>
      </div>
    </header>

    <main class="page-shell characters-shell">
      <div class="characters-layout">
        <aside class="panel character-filter-panel" aria-label="학생 목록 필터">
          <div class="panel-heading">
            <p class="eyebrow">FILTER</p>
            <h2>필터</h2>
          </div>

          <div class="character-search">
            <label class="character-search-label" for="character-name-search">학생 이름 검색</label>
            <input
              id="character-name-search"
              class="character-search-input"
              type="search"
              placeholder="학생 이름 또는 영문명 검색"
              autocomplete="off"
            />
          </div>

          <form class="character-filter-form" id="character-filter-form">
            <label>
              학원
              <select id="academy-filter" name="academy">
                <option value="">전체</option>
              </select>
            </label>

            <label>
              동아리
              <select id="club-filter" name="club">
                <option value="">전체</option>
              </select>
            </label>

            <label>
              <span class="filter-star-label" aria-label="성급">
                <img src="./images/icon/Icon_star.webp" alt="" aria-hidden="true" />
              </span>
              <select id="base-star-filter" name="baseStar">
                <option value="">전체</option>
                <option value="1">1성</option>
                <option value="2">2성</option>
                <option value="3">3성</option>
              </select>
            </label>

            <label>
              공격 타입
              <select id="attack-filter" name="attackType">
                <option value="">전체</option>
              </select>
            </label>

            <label>
              방어 타입
              <select id="defense-filter" name="defenseType">
                <option value="">전체</option>
              </select>
            </label>

            <label>
              역할
              <select id="role-filter" name="role">
                <option value="">전체</option>
              </select>
            </label>

            <label>
              포지션
              <select id="position-filter" name="position">
                <option value="">전체</option>
              </select>
            </label>

            <label>
              전투 구분
              <select id="combat-class-filter" name="combatClass">
                <option value="">전체</option>
              </select>
            </label>
          </form>
        </aside>

        <section class="panel characters-panel" aria-label="전체 학생 목록">
          <div class="panel-heading">
            <p class="eyebrow">STUDENTS</p>
            <h1>학생 목록</h1>
            <p>SchaleDB 기준 학생 데이터를 불러와 카드와 필터를 표시합니다.</p>
          </div>

          <div id="characters-list" class="characters-list"></div>
        </section>
      </div>
    </main>

    <script type="module" src="./pages/charactersPage.js"></script>
  </body>
</html>
