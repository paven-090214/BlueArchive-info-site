<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>픽업 기록 | BlueArchive Info Site</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="./index.html" aria-label="메인 페이지로 이동">
        <span class="logo-mark">BA</span>
        <span class="logo-text">BlueArchive Info Site</span>
      </a>

      <form class="site-search" id="site-search-form" role="search" aria-label="통합검색">
        <label class="search-label" for="site-search-input">통합검색</label>
        <input
          id="site-search-input"
          class="site-search-input"
          type="search"
          placeholder="통합검색"
          autocomplete="off"
        />
        <button class="site-search-button" type="submit" aria-label="검색 실행">🔍</button>
      </form>

      <div class="header-actions">
        <nav class="header-auth" aria-label="계정 메뉴">
          <a href="#" class="header-auth-link">로그인</a>
          <span aria-hidden="true">|</span>
          <a href="#" class="header-auth-link">회원가입</a>
        </nav>
      </div>
    </header>

    <main class="page-shell pickup-history-shell">
      <section class="panel pickup-history-panel" aria-label="픽업 기록">
        <div class="panel-heading">
          <p class="eyebrow">PICKUP ARCHIVE</p>
          <h1>픽업 기록</h1>
          <p>검수용 픽업 일정 데이터를 기준으로 픽업 캐릭터별 기록을 표시합니다.</p>
        </div>

        <nav
          id="pickup-history-pagination"
          class="pickup-history-pagination"
          aria-label="픽업 기록 주차 범위"
        ></nav>
        <div id="pickup-history-list" class="pickup-history-list"></div>
        <nav
          id="pickup-history-pagination-bottom"
          class="pickup-history-pagination pickup-history-pagination-bottom"
          aria-label="픽업 기록 주차 범위"
        ></nav>
      </section>
    </main>

    <script type="module" src="./pages/pickupHistoryPage.js"></script>
  </body>
</html>
