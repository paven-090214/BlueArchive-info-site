<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>픽업 기록 | BlueArchive Info Site</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="./index.html" aria-label="메인 페이지로 이동">
        <span class="logo-mark">BA</span>
        <span class="logo-text">BlueArchive Info Site</span>
      </a>

      <div class="student-search" role="search" aria-label="통합검색">
        <label class="search-label" for="site-search-input">통합검색</label>
        <input
          id="site-search-input"
          class="student-search-input"
          type="search"
          placeholder="통합검색"
          autocomplete="off"
          aria-expanded="false"
        />
      </div>
    </header>

    <main class="page-shell pickup-history-shell">
      <section class="panel pickup-history-panel" aria-label="픽업 기록">
        <div class="panel-heading">
          <p class="eyebrow">PICKUP ARCHIVE</p>
          <h1>픽업 기록</h1>
          <p>검수용 픽업 일정 데이터를 기준으로 픽업 캐릭터별 기록을 표시합니다.</p>
        </div>

        <nav
          id="pickup-history-pagination"
          class="pickup-history-pagination"
          aria-label="픽업 기록 주차 범위"
        ></nav>
        <div id="pickup-history-list" class="pickup-history-list"></div>
        <nav
          id="pickup-history-pagination-bottom"
          class="pickup-history-pagination pickup-history-pagination-bottom"
          aria-label="픽업 기록 주차 범위"
        ></nav>
      </section>
    </main>

    <script type="module">
      import { students } from "./data/index.js";

      const pickupHistoryList = document.querySelector("#pickup-history-list");
      const pickupHistoryPaginations = document.querySelectorAll(".pickup-history-pagination");
      const weeksPerPage = 20;
      const visiblePageButtonCount = 5;

      async function getPickupCandidates() {
        const response = await fetch("./data/pickups.json");

        if (!response.ok) {
          throw new Error("픽업 기록 데이터를 불러오지 못했습니다.");
        }

        return response.json();
      }

      function flattenPickupCards(schedules) {
        return schedules.flatMap((schedule) =>
          schedule.characters.map((character) => ({
            weekLabel: schedule.weekLabel,
            weekNumber: getWeekNumber(schedule.weekLabel),
            startDate: schedule.startDate,
            endDate: schedule.endDate,
            title: schedule.title,
            bannerImageUrl: schedule.bannerImageUrl ?? null,
            status: schedule.status ?? null,
            needsReview: schedule.needsReview,
            character,
          })),
        );
      }

      function getWeekNumber(weekLabel) {
        const match = String(weekLabel || "").match(/\d+/);
        return match ? Number(match[0]) : null;
      }

      function parseDate(value) {
        const date = new Date(`${value}T00:00:00`);
        return Number.isNaN(date.getTime()) ? null : date;
      }

      function getPickupStatus(pickup) {
        if (pickup.status) {
          return pickup.status;
        }

        const startDate = parseDate(pickup.startDate);
        const endDate = parseDate(pickup.endDate);

        if (!startDate || !endDate) {
          return null;
        }

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        if (today >= startDate && today <= endDate) {
          return "진행중";
        }

        if (today < startDate) {
          return "예정";
        }

        return "종료";
      }

      function createWeekRanges(cards) {
        const weekNumbers = cards
          .map((card) => card.weekNumber)
          .filter((weekNumber) => Number.isFinite(weekNumber));

        if (weekNumbers.length === 0) {
          return [];
        }

        const maxWeek = Math.max(...weekNumbers);
        const ranges = [];

        for (let startWeek = 1; startWeek <= maxWeek; startWeek += weeksPerPage) {
          ranges.push({
            page: ranges.length + 1,
            startWeek,
            endWeek: Math.min(startWeek + weeksPerPage - 1, maxWeek),
          });
        }

        return ranges;
      }

      function getPageFromUrl(maxPage) {
        const pageParam = new URLSearchParams(window.location.search).get("page");
        const page = Number(pageParam);

        if (!pageParam || !Number.isInteger(page)) {
          return maxPage;
        }

        return Math.min(Math.max(page, 1), maxPage);
      }

      function updatePageUrl(page, shouldReplace = false) {
        const url = new URL(window.location.href);
        url.searchParams.set("page", String(page));

        if (shouldReplace) {
          window.history.replaceState({ page }, "", url);
          return;
        }

        window.history.pushState({ page }, "", url);
      }

      function createRangeButton(range, isActive) {
        const button = document.createElement("button");
        button.className = "pickup-history-page-button";
        button.type = "button";
        button.textContent = `${range.startWeek}~${range.endWeek}주차`;
        button.dataset.page = String(range.page);

        if (isActive) {
          button.classList.add("is-active");
          button.setAttribute("aria-current", "page");
        }

        return button;
      }

      function createPaginationControl(label, action, ariaLabel) {
        const button = document.createElement("button");
        button.className = "pickup-history-page-button pickup-history-control-button";
        button.type = "button";
        button.textContent = label;
        button.dataset.action = action;
        button.setAttribute("aria-label", ariaLabel);
        return button;
      }

      function getVisibleRanges(ranges, activePage) {
        const groupIndex = Math.floor((activePage - 1) / visiblePageButtonCount);
        const startIndex = groupIndex * visiblePageButtonCount;
        return ranges.slice(startIndex, startIndex + visiblePageButtonCount);
      }

      function renderPagination(ranges, activePage) {
        const visibleRanges = getVisibleRanges(ranges, activePage);
        const isFirstPage = activePage <= 1;
        const isLastPage = activePage >= ranges.length;
        const isFirstGroup = visibleRanges[0]?.page === 1;
        const isLastGroup = visibleRanges.at(-1)?.page === ranges.length;

        pickupHistoryPaginations.forEach((pagination) => {
          const prevGroupButton = createPaginationControl("<<", "prev-group", "이전 주차 범위 묶음");
          prevGroupButton.disabled = isFirstGroup;

          const prevPageButton = createPaginationControl("<", "prev-page", "이전 주차 범위");
          prevPageButton.disabled = isFirstPage;

          const nextPageButton = createPaginationControl(">", "next-page", "다음 주차 범위");
          nextPageButton.disabled = isLastPage;

          const nextGroupButton = createPaginationControl(">>", "next-group", "다음 주차 범위 묶음");
          nextGroupButton.disabled = isLastGroup;

          const rangeGroup = document.createElement("div");
          rangeGroup.className = "pickup-history-range-group";
          rangeGroup.append(...visibleRanges.map((range) => createRangeButton(range, range.page === activePage)));

          const paginationItems = [prevGroupButton, prevPageButton, rangeGroup, nextPageButton, nextGroupButton];
          pagination.hidden = ranges.length <= 1;
          pagination.replaceChildren(...paginationItems);
        });
      }

      function getPaginationActionPage(action, activePage, totalPages) {
        const currentGroupIndex = Math.floor((activePage - 1) / visiblePageButtonCount);
        const currentGroupStart = currentGroupIndex * visiblePageButtonCount + 1;

        if (action === "prev-page") {
          return Math.max(activePage - 1, 1);
        }

        if (action === "next-page") {
          return Math.min(activePage + 1, totalPages);
        }

        if (action === "prev-group") {
          return Math.max(currentGroupStart - visiblePageButtonCount, 1);
        }

        if (action === "next-group") {
          return Math.min(currentGroupStart + visiblePageButtonCount, totalPages);
        }

        return activePage;
      }

      function renderPickupPage(cards, ranges, page, shouldReplaceUrl = false) {
        const activeRange = ranges[page - 1];

        if (!activeRange) {
          showEmptyMessage("표시할 픽업 기록이 없습니다.");
          return;
        }

        const pageCards = cards.filter(
          (card) => card.weekNumber >= activeRange.startWeek && card.weekNumber <= activeRange.endWeek,
        );

        renderPagination(ranges, page);
        updatePageUrl(page, shouldReplaceUrl);
        pickupHistoryList.dataset.activePage = String(page);

        if (pageCards.length === 0) {
          showEmptyMessage("해당 주차 범위에 표시할 픽업 기록이 없습니다.");
        } else {
          pickupHistoryList.replaceChildren(...pageCards.map(createPickupCard));
        }
      }

      function createPickupCard(pickup) {
        const card = document.createElement("article");
        card.className = "pickup-history-card";

        const header = document.createElement("div");
        header.className = "pickup-history-card-header";

        const title = document.createElement("h2");
        title.textContent = pickup.weekLabel || "주차 미정";

        header.append(title);

        const status = getPickupStatus(pickup);
        if (status) {
          const statusBadge = document.createElement("span");
          statusBadge.className = `pickup-status ${
            status === "진행중"
              ? "is-current"
              : status === "종료"
                ? "is-ended"
                : "is-upcoming"
          }`;
          statusBadge.textContent = status;
          header.append(statusBadge);
        }

        if (pickup.needsReview) {
          const reviewBadge = document.createElement("span");
          reviewBadge.className = "pickup-status is-review";
          reviewBadge.textContent = "검수 필요";
          header.append(reviewBadge);
        }

        const meta = document.createElement("dl");
        meta.className = "pickup-history-meta";

        meta.append(createBannerItem(pickup));

        [
          ["픽업 캐릭터", pickup.character.name],
          ["시작일", pickup.startDate],
          ["종료일", pickup.endDate],
          ["픽업 유형", pickup.character.type || "유형 확인 필요"],
        ].forEach(([label, value]) => {
          const item = document.createElement("div");
          const term = document.createElement("dt");
          const description = document.createElement("dd");
          term.textContent = label;
          description.textContent = value;
          item.append(term, description);
          meta.append(item);
        });

        card.append(header, meta);
        return card;
      }

      function createBannerItem(pickup) {
        const item = document.createElement("div");
        item.className = "pickup-banner-cell";
        const term = document.createElement("dt");
        const description = document.createElement("dd");
        term.textContent = "픽업 이미지";
        const imageUrl = pickup.character.imageUrl || pickup.bannerImageUrl;

        if (imageUrl) {
          const image = document.createElement("img");
          image.src = imageUrl;
          image.alt = `${pickup.character.name} 픽업 이미지`;
          image.loading = "lazy";
          description.append(image);
        } else {
          const placeholder = document.createElement("span");
          placeholder.className = "pickup-banner-placeholder";
          placeholder.textContent = "픽업 이미지 준비 중";
          description.append(placeholder);
        }

        item.append(term, description);
        return item;
      }

      function showEmptyMessage(message) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "pickup-history-empty";
        emptyMessage.textContent = message;
        pickupHistoryList.replaceChildren(emptyMessage);
      }

      try {
        const pickupCandidates = await getPickupCandidates();
        const pickupCards = flattenPickupCards(pickupCandidates);
        const weekRanges = createWeekRanges(pickupCards);

        if (pickupCards.length === 0 || weekRanges.length === 0) {
          showEmptyMessage("표시할 픽업 기록이 없습니다.");
        } else {
          const currentPage = getPageFromUrl(weekRanges.length);
          renderPickupPage(pickupCards, weekRanges, currentPage, true);

          pickupHistoryPaginations.forEach((pagination) => {
            pagination.addEventListener("click", (event) => {
              const button = event.target.closest(".pickup-history-page-button");

              if (!button) {
                return;
              }

              if (button.disabled) {
                return;
              }

              const currentPage = Number(pickupHistoryList.dataset.activePage || 1);
              const nextPage = button.dataset.page
                ? Number(button.dataset.page)
                : getPaginationActionPage(button.dataset.action, currentPage, weekRanges.length);

              renderPickupPage(pickupCards, weekRanges, nextPage);
            });
          });

          window.addEventListener("popstate", () => {
            renderPickupPage(pickupCards, weekRanges, getPageFromUrl(weekRanges.length), true);
          });
        }
      } catch (error) {
        showEmptyMessage(error.message);
      }

    </script>
  </body>
</html>
